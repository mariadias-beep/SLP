<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 170" font-family="monospace" font-size="14"><rect width="520" height="170" fill="#f8fafc" stroke="#9aa7bd"/><text x="10" y="24">#include &lt;iostream&gt;</text><text x="270" y="24" fill="#1f5fbf">← bibliotecas</text><text x="10" y="49">using namespace std;</text><text x="270" y="49" fill="#1f5fbf">← espaço de nomes</text><text x="10" y="74">int main() {</text><text x="270" y="74" fill="#1f5fbf">← início do programa</text><text x="10" y="99">  cout &lt;&lt; "Olá";</text><text x="270" y="99" fill="#1f5fbf">← instrução (termina em ;)</text><text x="10" y="124">  return 0;</text><text x="270" y="124" fill="#1f5fbf">← fim com sucesso</text><text x="10" y="149">}</text><text x="270" y="149" fill="#1f5fbf">← fim do bloco</text></svg>